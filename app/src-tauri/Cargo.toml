[package]
name = "posewear"
version = "0.1.0"
description = "衣姿 PoseWear"
license = "MIT"
edition = "2021"

[lib]
name = "posewear_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
