name: 客户端构建（Windows / Android）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'app/src-tauri -> target' }
      - name: 组装前端（数据离线打包）
        shell: bash
        run: python scripts/build-app.py app/www
      - name: 构建安装包（NSIS .exe + MSI）
        shell: bash
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: 安装 NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'app/src-tauri -> target' }
      - name: 组装前端（数据离线打包）
        run: python3 scripts/build-app.py app/www
      - name: 构建 APK
        working-directory: app
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri icon ../src/icon-512.png
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: 签名 APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          IN=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "unsigned: $IN"
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$IN" out/aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.p12
            "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias posewear --out "out/PoseWear_${GITHUB_REF_NAME#v}_android.apk" out/aligned.apk
            rm ks.p12
          else
            echo "::warning::没有配置签名密钥，改用临时调试密钥签名"
            keytool -genkeypair -keystore dbg.jks -alias dbg -keyalg RSA -validity 10000 -storepass android -keypass android -dname CN=debug
            "$BT/apksigner" sign --ks dbg.jks --ks-pass pass:android --out "out/PoseWear_${GITHUB_REF_NAME#v}_android.apk" out/aligned.apk
          fi
          rm out/aligned.apk
          "$BT/apksigner" verify --print-certs out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist-app, merge-multiple: true }
      - run: ls -la dist-app
      - uses: softprops/action-gh-release@v2
        with:
          name: 衣姿 PoseWear 客户端 ${{ github.ref_name }}
          files: dist-app/*
          body: |
            Windows 安装包（.exe 为 NSIS 安装程序，.msi 为 Windows Installer）与安卓 APK。

            - 素材数据随客户端离线打包，图片从线上图床加载（需要联网）。
            - 生图服务商：OpenAI、Gemini、xAI Grok（官方 API Key）、千问 Qwen-Image（阿里云百炼）、豆包 Seedream、自定义中转；可选「Grok 会员（网页 Cookie）」非官方通道（风险自负，未经真实账号验证）。
            - DeepSeek / 小米 MiMo 官方 API 没有生图接口，只作为「提示词助手」润色提示词。
            - 在应用里「试穿台 → 设置」填写各家 API Key，只保存在本机。
